name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest streamlit netCDF4 imageio-ffmpeg
          pip install -e .

      - name: Run tests
        id: test_run
        run: |
          pytest -q --tb=short > pytest_output.txt 2>&1 || touch FAILED
          cat pytest_output.txt

      - name: Publish Summary
        if: always()
        run: |
          if [ -f FAILED ]; then
            grep -E 'FAILED|ERROR' pytest_output.txt | head -n 30 | while IFS= read -r line; do
              echo "::error title=Pytest Failure::$line"
            done
            exit 1
          fi
